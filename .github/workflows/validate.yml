name: Validate portfolio
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  privacy-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm run check:privacy
      - name: Scan history with checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scan_tools=$(mktemp -d)
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$scan_tools/gitleaks.tar.gz"
          (cd "$scan_tools" && echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum -c -)
          tar -xzf "$scan_tools/gitleaks.tar.gz" -C "$scan_tools" gitleaks
          "$scan_tools/gitleaks" git . --log-opts='--all' --redact --no-banner
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm test
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.11.4'
      - run: terraform fmt -check -recursive infra
      - name: Validate and mock-test without cloud credentials
        run: |
          for root in infra/examples/site infra/examples/oidc; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
            terraform -chdir="$root" test
          done
